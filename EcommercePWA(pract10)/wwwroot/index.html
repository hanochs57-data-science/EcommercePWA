<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>E-Commerce App</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d63fd" />
    <style>
        body{
            font-family:Arial;
            margin:20px;
        }
        .container{
            display:flex;
            gap:30px;
        }
        .cart-section{
            width:30%;
        }
        .products{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }
        .products{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }
        .product{
            border:1px solid gray;
            padding:10px;
            width:200px;
        }
        button{
            padding:5px 10px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>E-Commerce App</h1>
    <div class="container">

        <div class="cart-section">
            <h2>Cart Items</h2>
            <ul id="cartList"></ul>
        </div>
        <div class="product-section">
            <h2>Products</h2>
            <div class="product">
                <h3>Laptop</h3>
                <p>Price: ₹50000</p>
                <button onclick="addToCart('Laptop')">
                    Add to Cart
                </button>
            </div>
            <div class="product">
                <h3>Smartphone</h3>
                <p>Price: ₹20000</p>
                <button onclick="addToCart('Smartphone')">
                    Add to Cart
                </button>
            </div>
            <div class="product">
                <h3>Headphones</h3>
                <p>Price: ₹2000</p>
                <button onclick="addToCart('Headphones')">
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
